name: jaibo-pos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jaibo_pos
      POSTGRES_USER: jaibo_pos
      POSTGRES_PASSWORD: jaibo_pos_local
    ports:
      - "5432:5432"
    volumes:
      - jaibo_pos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaibo_pos -d jaibo_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jaibo_pos_postgres_data: