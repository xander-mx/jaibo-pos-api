spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

app:
  security:
    jwt:
      secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.eljaibo.pos: INFO