spring:
  application:
    name: jaibo-pos-api

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      issuer: jaibo-pos-api
      access-token-ttl: 12h
  frontend:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    com.eljaibo.pos: INFO